<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Learn poker from the rules to game theory. Every number is derived on screen or computed by the engine in your browser." />
    <meta name="theme-color" content="#0d0c0a" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Poker Academy</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('poker-academy') || '{}');
        var t = s && s.state && s.state.settings && s.state.settings.theme;
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
